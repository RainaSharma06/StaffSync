version: '3.8'

services:
  staffsync-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staffsync-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/staffsync
      - JWT_SECRET=staffsync_production_secret_key_2025
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: staffsync-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
